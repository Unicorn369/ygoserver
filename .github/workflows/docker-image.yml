name: Docker Image CI

on:
  push:
    branches: [ "edo" ]
  pull_request:
    branches: [ "edo" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download musl-tools
        run: |
          mkdir -p /opt
          wget -O tools.tar.xz https://github.com/Unicorn369/ygoserver/releases/download/v0.0.1/linux-musl-tools.tar.xz
          tar xf tools.tar.xz
          mv -f linux-musl-tools /opt/
          rm -rf tools.tar.xz
      
      - name: Download Data
        run: |
          wget -O srvpro.zip https://github.com/DyXel/Multirole/archive/refs/heads/master.zip
          wget -O library.tar.xz https://github.com/Unicorn369/ygoserver/releases/download/v0.0.1/library.tar.xz
          unzip -o -qq srvpro.zip
          mv Multirole-master server
          mkdir -p server-bin
          rm -rf srvpro.zip

      - name: Build Multirole Init
        run: |
          export PATH=$PATH:/opt/linux-musl-tools/bin
          cp -rf dep/* server/
          mv -f library.tar.xz server/
          cd server/
          tar xf library.tar.xz
          premake5 gmake
      
      - name: Build Multirole amd64
        run: |
          export PATH=$PATH:/opt/linux-musl-tools/bin
          export CHOST=x86_64-linux-musl
          export AR=$CHOST-ar
          export CC=$CHOST-cc
          export CXX=$CHOST-c++
          export LD=$CHOST-ld
          export STRIP=$CHOST-strip
          cd server/
          rm -rf bin obj lib
          mv lib.amd64 lib
          cd build/
          make config=release -j$(grep -c "processor" /proc/cpuinfo)
          mv -f ../bin/release/hornet ../../server-bin/hornet-amd64
          mv -f ../bin/release/multirole ../../server-bin/multirole-amd64
      
      - name: Build Multirole arm64
        run: |
          export PATH=$PATH:/opt/linux-musl-tools/bin
          export CHOST=aarch64-linux-musl
          export AR=$CHOST-ar
          export CC=$CHOST-cc
          export CXX=$CHOST-c++
          export LD=$CHOST-ld
          export STRIP=$CHOST-strip
          cd server/
          rm -rf bin obj lib
          mv lib.arm64 lib
          cd build/
          make config=release -j$(grep -c "processor" /proc/cpuinfo)
          mv -f ../bin/release/hornet ../../server-bin/hornet-arm64
          mv -f ../bin/release/multirole ../../server-bin/multirole-arm64
      
      - name: Build Multirole arm
        run: |
          export PATH=$PATH:/opt/linux-musl-tools/bin
          export CHOST=arm-linux-musleabihf
          export AR=$CHOST-ar
          export CC=$CHOST-cc
          export CXX=$CHOST-c++
          export LD=$CHOST-ld
          export STRIP=$CHOST-strip
          cd server/
          rm -rf bin obj lib
          mv lib.arm lib
          cd build/
          make config=release -j$(grep -c "processor" /proc/cpuinfo)
          mv -f ../bin/release/hornet ../../server-bin/hornet-arm
          mv -f ../bin/release/multirole ../../server-bin/multirole-arm
      
      - name: Organize Data
        run: |
          export PATH=$PATH:/opt/linux-musl-tools/bin
          x86_64-linux-musl-strip  server-bin/hornet-amd64
          x86_64-linux-musl-strip  server-bin/multirole-amd64
          aarch64-linux-musl-strip server-bin/hornet-arm64
          aarch64-linux-musl-strip server-bin/multirole-arm64
          arm-linux-musleabihf-strip server-bin/hornet-arm
          arm-linux-musleabihf-strip server-bin/multirole-arm
          rm -rf server

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64, linux/arm64, linux/arm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ygoserver:edo
          build-args: |
            DATA_PATH=./data
            SERVER_PATH=./server-bin
